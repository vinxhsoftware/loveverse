

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb6c1);
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
    position:relative;
    z-index:2;
}

.title{
    color:white;
    font-size:55px;
    font-weight:bold;
    text-shadow:0 0 20px rgba(255,255,255,.8);
    margin-bottom:30px;
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 30px #fff,0 0 60px pink;
    }
}

.heart{
    width:160px;
    height:160px;
    background:#ff1744;
    position:relative;
    transform:rotate(-45deg);
    margin:auto;
    animation:beat 1s infinite;
    box-shadow:0 0 40px rgba(255,0,70,.7);
}

.heart:before,
.heart:after{
    content:"";
    width:160px;
    height:160px;
    background:#ff1744;
    position:absolute;
    border-radius:50%;
}

.heart:before{
    top:-80px;
    left:0;
}

.heart:after{
    left:80px;
    top:0;
}

@keyframes beat{
    0%{
        transform:rotate(-45deg) scale(1);
    }
    25%{
        transform:rotate(-45deg) scale(1.15);
    }
    50%{
        transform:rotate(-45deg) scale(1);
    }
    75%{
        transform:rotate(-45deg) scale(1.2);
    }
    100%{
        transform:rotate(-45deg) scale(1);
    }
}

/* Flying Hearts */

.fly-heart{
    position:absolute;
    bottom:-50px;
    color:#ff004c;
    animation:float linear infinite;
    opacity:.8;
}

@keyframes float{
    0%{
        transform:translateY(0) scale(.5);
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.5) rotate(360deg);
        opacity:0;
    }
}

/* Sparkles */

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(2);
    }
}

.message{
    margin-top:45px;
    color:white;
    font-size:28px;
    letter-spacing:2px;
    animation:updown 2s infinite;
}

@keyframes updown{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}
</style>
</head>

<body>

<div class="container">

<div class="title">
❤️ I LOVE YOU ❤️
</div>

<div class="heart"></div>

<div class="message">
Forever & Always 💕
</div>

</div>

<script>

// Flying Hearts
function createHeart(){

    const heart=document.createElement("div");
    heart.classList.add("fly-heart");

    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(20+Math.random()*40)+"px";

    heart.style.animationDuration=(4+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(createHeart,300);

// Stars
for(let i=0;i<80;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";

    star.style.top=Math.random()*100+"vh";

    star.style.animationDelay=Math.random()*2+"s";

    document.body.appendChild(star);

}

</script>

</body>
</html>
